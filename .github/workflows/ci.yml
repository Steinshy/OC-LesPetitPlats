name: CI

on:
  push:
    branches:
      - dev
      - benchmarkV2
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy static content to Pages"
    types:
      - completed
    branches:
      - dev

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:eslint

      - name: Run Stylelint
        run: npm run lint:css

      - name: Run HTML validation
        run: npm run lint:html

      - name: Run Markdown lint
        run: npm run lint:md

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  benchmark:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies for benchmark
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Run benchmark tests
        env:
          CI: true
          RUN_ALL_TESTS: true
        run: |
          # Run benchmark tests non-interactively with "All" tests enabled
          # - CI=true: Script auto-detects CI and skips all interactive prompts
          # - RUN_ALL_TESTS=true: Enable expensive "All" tests in CI (up to 10 min each)
          # Script automatically skips browser opening prompt in CI mode
          npm run benchmark || true
        continue-on-error: true

      - name: Check if benchmark reports exist
        id: check-reports
        if: always()
        run: |
          # Check for generated benchmark reports
          # Reports are generated in Benchmark/ directory by viteTest/Benchmarks/utils/reporting/generateReport.js
          if [ -f "Benchmark/benchmark-report-all.html" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload benchmark HTML reports
        uses: actions/upload-artifact@v4
        if: always() && steps.check-reports.outputs.exists == 'true'
        with:
          name: benchmark-reports-html
          path: Benchmark/benchmark-report-*.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload benchmark results JSON
        uses: actions/upload-artifact@v4
        if: always() && steps.check-reports.outputs.exists == 'true'
        with:
          name: benchmark-results-json
          # Note: Results JSON is stored in temp directory during execution
          # HTML report contains all benchmark data
          path: Benchmark/benchmark-results.json
          retention-days: 30
          if-no-files-found: ignore

  lespetitplats-tests:
    name: LesPetitPlats Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run LesPetitPlats tests
        id: run-tests
        env:
          CI: true
        run: |
          # Run LesPetitPlats unit tests
          # - CI=true: Ensures non-interactive mode
          # Tests are located in viteTest/LesPetitPlats/
          npm test -- viteTest/LesPetitPlats/ --run
        continue-on-error: true

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lespetitplats-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npx @stryker-mutator/core run
        continue-on-error: true

      - name: Upload mutation test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-test-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
