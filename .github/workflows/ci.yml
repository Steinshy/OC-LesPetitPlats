name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy static content to Pages"
    types:
      - completed
    branches:
      - dev

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "25"

jobs:
  code-quality-security:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0
          comment-summary-in-pr: always

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 1
          if-no-files-found: ignore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:eslint
        continue-on-error: true

      - name: Run Stylelint
        run: npm run lint:css
        continue-on-error: true

      - name: Run HTML validation
        run: npm run lint:html
        continue-on-error: true

      - name: Run Markdown lint
        run: npm run lint:md
        continue-on-error: true

      - name: Run ESLint security plugin
        run: npm run lint:eslint -- --max-warnings=0
        env:
          ESLINT_PLUGIN_SECURITY: "true"
        continue-on-error: true

      - name: Check for known security issues
        run: |
          npm run lint:eslint 2>&1 | grep -i "security" || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

      - name: Run npm audit
        run: npm audit --audit-level=moderate --production
        continue-on-error: true

      - name: Run npm audit (dev dependencies)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          compression-level: 6

  benchmark:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies for benchmark
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Run benchmark tests
        env:
          CI: true
          RUN_ALL_TESTS: true
        run: |
          # Run benchmark tests non-interactively with "All" tests enabled
          # - CI=true: Script auto-detects CI and skips all interactive prompts
          # - RUN_ALL_TESTS=true: Enable expensive "All" tests in CI (up to 10 min each)
          # Script automatically skips browser opening prompt in CI mode
          npm run benchmark || true
        continue-on-error: true

      - name: Check if benchmark reports exist
        id: check-reports
        if: always()
        run: |
          # Check for generated benchmark reports
          # Reports are generated in benchmark-results/Benchmark/ directory (per viteTest/helper/paths.js)
          # Report names: benchmark-all-YYYY-MM-DD.html, benchmark-partial-YYYY-MM-DD.html, or benchmark-{testname}-YYYY-MM-DD.html
          if ls benchmark-results/Benchmark/benchmark-*.html 1> /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_dir=benchmark-results/Benchmark" >> $GITHUB_OUTPUT
          elif ls Benchmark/benchmark-*.html 1> /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_dir=Benchmark" >> $GITHUB_OUTPUT
          elif ls Report/benchmark-*.html 1> /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_dir=Report" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload benchmark HTML reports
        uses: actions/upload-artifact@v4
        if: always() && steps.check-reports.outputs.exists == 'true'
        with:
          name: benchmark-reports-html
          path: ${{ steps.check-reports.outputs.report_dir || 'benchmark-results/Benchmark' }}/benchmark-*.html
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 6

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Cache Vitest
        uses: actions/cache@v4
        with:
          path: node_modules/.vitest
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/package-lock.json', '**/vitest.config.js') }}
          restore-keys: |
            ${{ runner.os }}-vitest-

      - name: Install dependencies
        run: npm ci

      - name: Run Unit tests with coverage
        id: run-tests
        env:
          CI: true
        run: |
          # Run Unit tests with coverage and JUnit XML output for Codecov Test Analytics
          # - CI=true: Ensures non-interactive mode
          # Tests are located in viteTest/Unit/
          # Note: Coverage may fail due to thresholds, but reports are still generated
          npx vitest --coverage --reporter=junit --outputFile=test-report.junit.xml --run viteTest/Unit/ || true
        continue-on-error: true

      - name: Check if coverage reports exist
        id: check-coverage
        if: always()
        run: |
          # Check for generated coverage reports
          # Coverage reports are generated in benchmark-results/Unit/ directory (per vitest.config.js)
          # Even if tests fail due to thresholds, the lcov.info file should exist
          if [ -f "benchmark-results/Unit/lcov.info" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_path=benchmark-results/Unit" >> $GITHUB_OUTPUT
          elif [ -f "coverage/lcov.info" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_path=coverage" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        if: always() && steps.check-coverage.outputs.exists == 'true'
        with:
          name: unit-tests-coverage
          path: ${{ steps.check-coverage.outputs.report_path || 'benchmark-results/Unit' }}/
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 6

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always() && steps.check-coverage.outputs.exists == 'true'
        with:
          files: ./${{ steps.check-coverage.outputs.report_path || 'benchmark-results/Unit' }}/lcov.info
          flags: unit-tests
          name: unit-tests-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: test-report.junit.xml

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Cache Stryker
        uses: actions/cache@v4
        with:
          path: |
            .stryker-tmp
            reports
          key: ${{ runner.os }}-stryker-${{ hashFiles('**/package-lock.json', '**/stryker.conf.js') }}
          restore-keys: |
            ${{ runner.os }}-stryker-

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        id: run-mutation-tests
        run: |
          # Run mutation tests with Stryker
          # Reports are generated in reports/ directory (configured in stryker.conf.js)
          npx @stryker-mutator/core run || true
          # Mutation tests may fail due to thresholds, but reports are still generated
        continue-on-error: true

      - name: Check if mutation test reports exist
        id: check-mutation-reports
        if: always()
        run: |
          # Check for generated mutation test reports
          # Reports are generated in reports/ directory by Stryker
          # Main report: reports/mutation.html
          if [ -f "reports/mutation.html" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload mutation test report
        uses: actions/upload-artifact@v4
        if: always() && steps.check-mutation-reports.outputs.exists == 'true'
        with:
          name: mutation-test-report
          path: reports/
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 6

      - name: Extract and display mutation score
        if: always() && steps.check-mutation-reports.outputs.exists == 'true'
        run: |
          if [ -f "reports/mutation/mutation.json" ]; then
            cat reports/mutation/mutation.json | grep -E '"mutationScore"|"mutationScoreBasedOnCoveredCode"' | head -2 || true
          elif [ -f "reports/mutation.json" ]; then
            cat reports/mutation.json | grep -E '"mutationScore"|"mutationScoreBasedOnCoveredCode"' | head -2 || true
          fi
