name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy static content to Pages"
    types:
      - completed
    branches:
      - dev

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "22"

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0
          comment-summary-in-pr: always

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:eslint

      - name: Run Stylelint
        run: npm run lint:css

      - name: Run HTML validation
        run: npm run lint:html

      - name: Run Markdown lint
        run: npm run lint:md

  code-scanning:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate --production
        continue-on-error: true

      - name: Run npm audit (dev dependencies)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: |
            npm-audit-results.json
          retention-days: 30
          if-no-files-found: ignore

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30
          if-no-files-found: ignore

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  security-lint:
    name: Security Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security plugin
        run: npm run lint:eslint -- --max-warnings=0
        env:
          ESLINT_PLUGIN_SECURITY: "true"

      - name: Check for known security issues
        run: |
          echo "Running security-focused linting checks..."
          npm run lint:eslint 2>&1 | grep -i "security" || echo "No security warnings found"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3
          compression-level: 6

  benchmark:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies for benchmark
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Run benchmark tests
        env:
          CI: true
          RUN_ALL_TESTS: true
        run: |
          # Run benchmark tests non-interactively with "All" tests enabled
          # - CI=true: Script auto-detects CI and skips all interactive prompts
          # - RUN_ALL_TESTS=true: Enable expensive "All" tests in CI (up to 10 min each)
          # Script automatically skips browser opening prompt in CI mode
          npm run benchmark || true
        continue-on-error: true

      - name: Check if benchmark reports exist
        id: check-reports
        if: always()
        run: |
          # Check for generated benchmark reports
          # Reports are generated in benchmark-results/Benchmark/ directory (per viteTest/helper/paths.js)
          # Report names: benchmark-all-YYYY-MM-DD.html, benchmark-partial-YYYY-MM-DD.html, or benchmark-{testname}-YYYY-MM-DD.html
          if ls benchmark-results/Benchmark/benchmark-*.html 1> /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_dir=benchmark-results/Benchmark" >> $GITHUB_OUTPUT
            echo "✓ Benchmark reports found in benchmark-results/Benchmark/:"
            ls -lh benchmark-results/Benchmark/benchmark-*.html | awk '{print "  - " $9 " (" $5 ")"}'
            echo "Total reports: $(ls benchmark-results/Benchmark/benchmark-*.html | wc -l)"
          elif ls Benchmark/benchmark-*.html 1> /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_dir=Benchmark" >> $GITHUB_OUTPUT
            echo "✓ Benchmark reports found in Benchmark/:"
            ls -lh Benchmark/benchmark-*.html | awk '{print "  - " $9 " (" $5 ")"}'
            echo "Total reports: $(ls Benchmark/benchmark-*.html | wc -l)"
          elif ls Report/benchmark-*.html 1> /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_dir=Report" >> $GITHUB_OUTPUT
            echo "✓ Benchmark reports found in Report/:"
            ls -lh Report/benchmark-*.html | awk '{print "  - " $9 " (" $5 ")"}'
            echo "Total reports: $(ls Report/benchmark-*.html | wc -l)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠ Warning: No benchmark reports found"
            echo "Checking benchmark-results/Benchmark/:"
            ls -la benchmark-results/Benchmark/ 2>/dev/null || echo "benchmark-results/Benchmark directory does not exist"
            echo "Checking Benchmark/:"
            ls -la Benchmark/ 2>/dev/null || echo "Benchmark directory does not exist"
            echo "Checking Report/:"
            ls -la Report/ 2>/dev/null || echo "Report directory does not exist"
            echo "Searching for benchmark HTML files:"
            find . -name "benchmark-*.html" -type f 2>/dev/null | head -5 || echo "No benchmark HTML files found"
          fi

      - name: Upload benchmark HTML reports
        uses: actions/upload-artifact@v4
        if: always() && steps.check-reports.outputs.exists == 'true'
        with:
          name: benchmark-reports-html
          path: ${{ steps.check-reports.outputs.report_dir || 'benchmark-results/Benchmark' }}/benchmark-*.html
          retention-days: 30
          if-no-files-found: ignore
          compression-level: 6

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Cache Vitest
        uses: actions/cache@v4
        with:
          path: node_modules/.vitest
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/package-lock.json', '**/vitest.config.js') }}
          restore-keys: |
            ${{ runner.os }}-vitest-

      - name: Install dependencies
        run: npm ci

      - name: Run Unit tests with coverage
        id: run-tests
        env:
          CI: true
        run: |
          # Run Unit tests with coverage
          # - CI=true: Ensures non-interactive mode
          # Tests are located in viteTest/Unit/
          # Note: Coverage may fail due to thresholds, but reports are still generated
          npm run test:coverage -- viteTest/Unit/ || true
        continue-on-error: true

      - name: Check if coverage reports exist
        id: check-coverage
        if: always()
        run: |
          # Check for generated coverage reports
          # Coverage reports are generated in benchmark-results/Unit/ directory (per vitest.config.js)
          # Even if tests fail due to thresholds, the lcov.info file should exist
          if [ -f "benchmark-results/Unit/lcov.info" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_path=benchmark-results/Unit" >> $GITHUB_OUTPUT
            echo "✓ Coverage report found: benchmark-results/Unit/lcov.info"
            echo "File size: $(wc -c < benchmark-results/Unit/lcov.info) bytes"
          elif [ -f "coverage/lcov.info" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "report_path=coverage" >> $GITHUB_OUTPUT
            echo "✓ Coverage report found: coverage/lcov.info"
            echo "File size: $(wc -c < coverage/lcov.info) bytes"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠ Warning: Coverage report not found"
            echo "Checking benchmark-results/Unit/:"
            ls -la benchmark-results/Unit/ 2>/dev/null || echo "benchmark-results/Unit directory does not exist"
            echo "Checking coverage/:"
            ls -la coverage/ 2>/dev/null || echo "coverage directory does not exist"
            echo "Searching for any .info files:"
            find . -name "lcov.info" -type f 2>/dev/null | head -5 || echo "No lcov.info files found"
          fi

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        if: always() && steps.check-coverage.outputs.exists == 'true'
        with:
          name: unit-tests-coverage
          path: ${{ steps.check-coverage.outputs.report_path || 'benchmark-results/Unit' }}/
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 6

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always() && steps.check-coverage.outputs.exists == 'true'
        with:
          files: ./${{ steps.check-coverage.outputs.report_path || 'benchmark-results/Unit' }}/lcov.info
          flags: unit-tests
          name: unit-tests-coverage
          fail_ci_if_error: false
          verbose: true

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Cache Stryker
        uses: actions/cache@v4
        with:
          path: |
            .stryker-tmp
            reports
          key: ${{ runner.os }}-stryker-${{ hashFiles('**/package-lock.json', '**/stryker.conf.js') }}
          restore-keys: |
            ${{ runner.os }}-stryker-

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        id: run-mutation-tests
        run: |
          # Run mutation tests with Stryker
          # Reports are generated in reports/ directory (configured in stryker.conf.js)
          npx @stryker-mutator/core run || true
          # Mutation tests may fail due to thresholds, but reports are still generated
        continue-on-error: true

      - name: Check if mutation test reports exist
        id: check-mutation-reports
        if: always()
        run: |
          # Check for generated mutation test reports
          # Reports are generated in reports/ directory by Stryker
          # Main report: reports/mutation.html
          if [ -f "reports/mutation.html" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Mutation test report found: reports/mutation.html"
            echo "File size: $(wc -c < reports/mutation.html) bytes"
            echo "Listing reports directory contents:"
            ls -lh reports/ 2>/dev/null | head -10
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠ Warning: Mutation test report not found at reports/mutation.html"
            echo "Listing reports directory contents:"
            ls -la reports/ 2>/dev/null || echo "Reports directory does not exist"
            echo "Checking for any HTML files in reports:"
            find reports -name "*.html" 2>/dev/null || echo "No HTML files found"
          fi

      - name: Upload mutation test report
        uses: actions/upload-artifact@v4
        if: always() && steps.check-mutation-reports.outputs.exists == 'true'
        with:
          name: mutation-test-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 6

      - name: Extract and display mutation score
        if: always() && steps.check-mutation-reports.outputs.exists == 'true'
        run: |
          # Extract mutation score from JSON report if available
          if [ -f "reports/mutation/mutation.json" ]; then
            echo "📊 Mutation Test Results:"
            cat reports/mutation/mutation.json | grep -E '"mutationScore"|"mutationScoreBasedOnCoveredCode"' | head -2 || echo "Could not extract mutation score"
          elif [ -f "reports/mutation.json" ]; then
            echo "📊 Mutation Test Results:"
            cat reports/mutation.json | grep -E '"mutationScore"|"mutationScoreBasedOnCoveredCode"' | head -2 || echo "Could not extract mutation score"
          else
            echo "ℹ️ JSON mutation report not found (HTML report available in artifacts)"
          fi
